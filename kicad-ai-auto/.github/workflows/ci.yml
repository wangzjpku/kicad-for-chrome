# KiCad for Chrome CI/CD Pipeline
#
# Phase 3.5: GitHub Actions workflow for automated testing and linting
# Includes: test matrix, linting, type checking, and coverage reporting

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  # Python version for backend
  PYTHON_VERSION: '3.11'
  # Node.js version for frontend
  NODE_VERSION: '20'

jobs:
  # ========================================
  # Backend Tests
  # ========================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      working-directory: ./kicad-ai-auto/agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install fastapi uvicorn pydantic pytest pytest-asyncio httpx

        working-directory: ./kicad-ai-auto/agent

      - name: Run Python linting
        run: |
          pip install ruff
          ruff check .
        working-directory: ./kicad-ai-auto/agent

      - name: Run backend tests
        run: |
          pytest tests/ -v --tb=short --maxfail=1 -x
        working-directory: ./kicad-ai-auto/agent

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./kicad-ai-auto/agent/htmlcov
          retention-days: 7

  # ========================================
  # Frontend Tests
  # ========================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      working-directory: ./kicad-ai-auto/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./kicad-ai-auto/web

      - name: Run TypeScript type check
        run: npm run typecheck
        working-directory: ./kicad-ai-auto/web

      - name: Run ESLint
        run: npm run lint
        working-directory: ./kicad-ai-auto/web

      - name: Run frontend tests
        run: npm run test -- --run
        working-directory: ./kicad-ai-auto/web

      - name: Build frontend
        run: npm run build
        working-directory: ./kicad-ai-auto/web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./kicad-ai-auto/web/dist
          retention-days: 7

  # ========================================
  # Integration Tests (Optional)
  # ========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    defaults:
      working-directory: ./kicad-ai-auto

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start backend
        run: |
          cd agent
          pip install -r ../docker/requirements.txt
          python main.py &
          sleep 5
        working-directory: ./kicad-ai-auto

      - name: Run integration tests
        run: |
          curl -f http://localhost:8000/api/health || exit 0
        working-directory: ./kicad-ai-auto

  # ========================================
  # Security Scan
  # ========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30
