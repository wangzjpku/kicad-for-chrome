version: '3.8'

services:
  # KiCad 运行环境 (无头模式)
  kicad:
    image: ghcr.io/kicad/kicad:9.0
    container_name: kicad-runtime
    environment:
      - DISPLAY=:99
      - PULSE_SERVER=tcp:127.0.0.1:4713
    volumes:
      - kicad-projects:/home/kicad/projects
      - kicad-config:/home/kicad/.config/kicad
    ports:
      - "5900:5900"    # VNC
      - "6080:6080"    # noVNC
    networks:
      - kicad-network
    command: >
      bash -c "
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        /opt/kicad/bin/kicad
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "Xvfb"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 控制Agent (FastAPI)
  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: kicad-agent
    environment:
      - KICAD_RUNTIME_HOST=kicad
      - KICAD_RUNTIME_PORT=5900
      - VNC_HOST=kicad
      - VNC_PORT=5900
      - DATABASE_URL=sqlite+aiosqlite:///./data/kicad_editor.db
      - PROJECTS_DIR=/projects
      - OUTPUT_DIR=/output
      - USE_VIRTUAL_DISPLAY=true
    volumes:
      - ../agent:/app
      - kicad-projects:/projects
      - kicad-output:/output
    ports:
      - "8000:8000"
    depends_on:
      kicad:
        condition: service_started
    networks:
      - kicad-network
    restart: unless-stopped

  # Web前端
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: kicad-web
    environment:
      - API_BASE_URL=http://agent:8000
    ports:
      - "3000:80"
    depends_on:
      - agent
    networks:
      - kicad-network
    restart: unless-stopped

  # Nginx反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: kicad-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
      - web
    networks:
      - kicad-network
    restart: unless-stopped

networks:
  kicad-network:
    driver: bridge

volumes:
  kicad-projects:
  kicad-config:
  kicad-output:
