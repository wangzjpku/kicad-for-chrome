  font-size: 10px;

  }
}

.toggle-btn {
  background: transparent;
  border: none;

/* 输入步骤 */
.step-input {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.step-input label {
  color: #eaeaea;
  font-size: 14px;
  font-weight: 500;
}

.step-input textarea {
  background: #0f3460;
  border: 1px solid #1a4a7a;
  border-radius: 8px;
  padding: 16px;
  color: #eaeaea;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  min-height: 150px;
}

.step-input textarea:focus {
  outline: none;
  border-color: #4a9eff;
  box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.2);
}

.step-input textarea::-moz-placeholder {
  color: #666;
}

.step-input textarea::placeholder {
  color: #666;
}

.hint {
  color: #888;
  font-size: 12px;
  margin: 0;
}

.error-message {
  color: #ff6b6b;
  font-size: 14px;
  margin: 0;
}

/* 分析步骤 */
.step-analyzing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 0;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #1a4a7a;
  border-top-color: #4a9eff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.progress-text {
  color: #4a9eff;
  font-size: 16px;
  margin-top: 20px;
}

/* 预览步骤 */
.step-preview {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.spec-section,
.schematic-section {
  background: #0f3460;
  border-radius: 8px;
  padding: 20px;
}

.spec-section h3,
.schematic-section h3 {
  margin: 0 0 16px 0;
  color: #eaeaea;
  font-size: 16px;
  border-bottom: 1px solid #1a4a7a;
  padding-bottom: 12px;
}

.spec-content h4 {
  margin: 0 0 12px 0;
  color: #4a9eff;
  font-size: 18px;
}

.spec-content h5 {
  margin: 16px 0 8px 0;
  color: #eaeaea;
  font-size: 14px;
}

.spec-content p {
  color: #aaa;
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
}

.params-table,
.components-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.params-table td,
.components-table th,
.components-table td {
  padding: 8px 12px;
  border: 1px solid #1a4a7a;
  color: #ccc;
}

.components-table th {
  background: #1a4a7a;
  color: #eaeaea;
  text-align: left;
}

.schematic-preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.schematic-preview p {
  background: #1a4a7a;
  padding: 12px;
  border-radius: 6px;
  text-align: center;
  margin: 0;
}

/* 通用原理图可视化预览 */
.schematic-canvas-wrapper {
  grid-column: 1 / -1;
  background: #0a1a2a;
  border: 2px solid #2a5a8a;
  border-radius: 8px;
  overflow: hidden;
  margin-top: 16px;
}

.schematic-canvas {
  width: 100%;
  height: 350px;
  display: block;
}

/* 元件详情列表 */
.schematic-components-detail {
  grid-column: 1 / -1;
  margin-top: 16px;
}

.schematic-components-detail h4 {
  margin: 0 0 12px 0;
  color: #7ac0f0;
  font-size: 14px;
}

.component-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.component-card {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #1a4a7a;
  padding: 8px 12px;
  border-radius: 6px;
  min-width: 150px;
}

.card-symbol {
  font-size: 20px;
}

.card-info {
  flex: 1;
  min-width: 0;
}

.card-name {
  font-weight: bold;
  color: #fff;
  font-size: 12px;
}

.card-model {
  color: #aaa;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 错误步骤 */
.step-error {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 0;
}

.error-text {
  color: #ff6b6b;
  font-size: 16px;
  text-align: center;
  margin: 0 0 24px 0;
}

/* 底部按钮栏 */
.dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 16px 24px;
  background: #16213e;
  border-top: 1px solid #0f3460;
}

.dialog-footer button {
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}

.cancel-btn {
  background: #3d3d3d;
  color: #ccc;
}

.cancel-btn:hover {
  background: #4d4d4d;
}

.submit-btn {
  background: #4a9eff;
  color: #fff;
}

.submit-btn:hover {
  background: #3a8eef;
}

.submit-btn:disabled {
  background: #2a4a6a;
  color: #555;
  cursor: not-allowed;
}

.back-btn {
  background: #3d3d3d;
  color: #ccc;
}

.back-btn:hover {
  background: #4d4d4d;
}

.abandon-btn {
  background: #ff6b6b;
  color: #fff;
}

.abandon-btn:hover {
  background: #ff5252;
}

.confirm-btn {
  background: #4caf50;
  color: #fff;
}

.confirm-btn:hover {
  background: #45a049;
}

.retry-btn,
.retry-btn-large {
  background: #4a9eff;
  color: #fff;
}

.retry-btn:hover,
.retry-btn-large:hover {
  background: #3a8eef;
}

/* ========== 新增: 大尺寸对话框 ========== */
.dialog-container-large {
  max-width: 900px;
  max-height: 92vh;
}

/* ========== 新增: 进度指示器 ========== */
.progress-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 24px;
  background: #0f3460;
  gap: 8px;
}

.progress-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.step-number {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #2a4a6a;
  color: #888;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.3s;
}

.progress-step.active .step-number {
  background: #4a9eff;
  color: #fff;
  box-shadow: 0 0 12px rgba(74, 158, 255, 0.5);
}

.progress-step.completed .step-number {
  background: #4caf50;
  color: #fff;
}

.step-label {
  font-size: 11px;
  color: #888;
  white-space: nowrap;
}

.progress-step.active .step-label {
  color: #4a9eff;
}

.progress-step.completed .step-label {
  color: #4caf50;
}

.progress-line {
  width: 40px;
  height: 2px;
  background: #2a4a6a;
  margin-bottom: 16px;
}

/* ========== 新增: 澄清问题界面 ========== */
.step-clarifying {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.detected-info {
  background: linear-gradient(135deg, #1a4a7a 0%, #0f3460 100%);
  padding: 12px 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.detected-label {
  color: #888;
  font-size: 13px;
}

.detected-type {
  color: #4ade80;
  font-weight: 600;
  font-size: 14px;
}

.clarifying-hint {
  color: #ccc;
  font-size: 14px;
  margin: 0;
  padding-bottom: 8px;
  border-bottom: 1px solid #1a4a7a;
}

.questions-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 400px;
  overflow-y: auto;
  padding-right: 8px;
}

.question-item {
  background: #0f3460;
  border-radius: 8px;
  padding: 16px;
  border-left: 3px solid #4a9eff;
}

.question-item.optional {
  border-left-color: #888;
}

.question-item.required {
  border-left-color: #4a9eff;
}

.question-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.question-number {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #4a9eff;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
}

.question-item.optional .question-number {
  background: #666;
}

.question-text {
  flex: 1;
  color: #eaeaea;
  font-size: 14px;
  font-weight: 500;
}

.optional-badge {
  background: #333;
  color: #888;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
}

.question-options {
  margin-top: 8px;
}

.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}

.option-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: #16213e;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.option-item:hover {
  background: #1a2a4e;
}

.option-item.selected {
  border-color: #4a9eff;
  background: rgba(74, 158, 255, 0.1);
}

.option-item.selected::after {
  content: '✓';
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: #4a9eff;
  font-weight: bold;
}

.option-item {
  position: relative;
}

.option-item input {
  display: none;
}

.option-item span {
  color: #ccc;
  font-size: 13px;
}

.option-item.selected span {
  color: #4a9eff;
}

.text-input {
  width: 100%;
  padding: 10px 12px;
  background: #16213e;
  border: 1px solid #2a4a6a;
  border-radius: 6px;
  color: #eaeaea;
  font-size: 14px;
}

.text-input:focus {
  outline: none;
  border-color: #4a9eff;
}

.answers-summary {
  text-align: center;
  padding-top: 12px;
  border-top: 1px solid #1a4a7a;
}

.answers-summary p {
  color: #888;
  font-size: 12px;
  margin: 0;
}

/* ========== 新增: 跳过按钮 ========== */
.skip-btn {
  background: #555;
  color: #aaa;
}

.skip-btn:hover {
  background: #666;
  color: #ccc;
}

/* ========== 滚动条美化 ========== */
.questions-list::-webkit-scrollbar {
  width: 6px;
}

.questions-list::-webkit-scrollbar-track {
  background: #0f3460;
  border-radius: 3px;
}

.questions-list::-webkit-scrollbar-thumb {
  background: #2a5a8a;
  border-radius: 3px;
}

.questions-list::-webkit-scrollbar-thumb:hover {
  background: #3a6a9a;
}

/* ========== 编辑模式样式 ========== */

.preview-toolbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 12px;
  padding: 8px;
  background: rgba(0, 0, 0, 0.1);
  border-radius: 6px;
}

.edit-mode-btn, .exit-edit-btn {
  padding: 8px 16px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}

.edit-mode-btn {
  background: #4a9eff;
  color: #fff;
}

.edit-mode-btn:hover {
  background: #3a8eef;
}

.exit-edit-btn {
  background: #4caf50;
  color: #fff;
}

.exit-edit-btn:hover {
  background: #45a049;
}

.edit-badge {
  background: #ff9800;
  color: #fff;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 8px;
}

/* 可编辑表格 */
.editable-table th {
  position: relative;
}

.add-btn.small {
  background: #4caf50;
  color: #fff;
  border: none;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  margin-left: 12px;
}

.add-btn.small:hover {
  background: #45a049;
}

.inline-input {
  width: 100%;
  padding: 4px 8px;
  background: #1a3a5a;
  border: 1px solid #4a9eff;
  border-radius: 4px;
  color: #fff;
  font-size: 13px;
}

.inline-input.small {
  width: 80px;
}

.inline-input.tiny {
  width: 50px;
  text-align: center;
}

.inline-input:focus {
  outline: none;
  border-color: #4caf50;
}

/* 操作按钮 */
.save-btn.small, .cancel-btn.small, .edit-btn.small, .delete-btn.small {
  padding: 4px 8px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  margin: 0 2px;
}

.save-btn.small {
  background: #4caf50;
  color: #fff;
}

.cancel-btn.small {
  background: #666;
  color: #fff;
}

.edit-btn.small {
  background: #4a9eff;
  color: #fff;
}

.delete-btn.small {
  background: #f44336;
  color: #fff;
}

.save-btn.small:hover { background: #45a049; }
.cancel-btn.small:hover { background: #777; }
.edit-btn.small:hover { background: #3a8eef; }
.delete-btn.small:hover { background: #da190b; }

/* 最终确认页面 */
.step-confirm {
  text-align: center;
  padding: 40px 20px;
}

.success-icon {
  font-size: 64px;
  margin-bottom: 20px;
}

.step-confirm h3 {
  color: #4caf50;
  margin-bottom: 24px;
  font-size: 24px;
}

.final-result-card {
  background: #0f3460;
  border-radius: 12px;
  padding: 24px;
  max-width: 500px;
  margin: 0 auto 24px;
  text-align: left;
}

.result-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #1a4a7a;
}

.result-item:last-child {
  border-bottom: none;
}

.result-item .label {
  color: #888;
  font-size: 14px;
}

.result-item .value {
  color: #fff;
  font-size: 14px;
  font-weight: 500;
}

.result-item .value.code {
  font-family: monospace;
  background: #1a4a7a;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
}

.confirm-hint {
  color: #888;
  font-size: 14px;
}

.confirm-btn.large {
  padding: 14px 40px;
  font-size: 16px;
  background: linear-gradient(135deg, #4caf50, #45a049);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
}

.confirm-btn.large:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
}

/* 编辑模式下的按钮 */
.edit-btn {
  background: #ff9800;
  color: #fff;
}

.edit-btn:hover {
  background: #f57c00;
}

/* ========== 文件上传区域样式 ========== */
.file-upload-section {
  margin-top: 16px;
  padding: 16px;
  background: #0a1628;
  border: 1px dashed #2a4a6a;
  border-radius: 8px;
}

.file-upload-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.file-upload-icon {
  font-size: 18px;
}

.file-upload-title {
  color: #eaeaea;
  font-size: 14px;
  font-weight: 500;
}

.file-upload-hint {
  color: #666;
  font-size: 12px;
  margin-left: auto;
}

.file-input-row {
  display: flex;
  gap: 8px;
}

.file-path-input {
  flex: 1;
  padding: 10px 12px;
  background: #16213e;
  border: 1px solid #2a4a6a;
  border-radius: 6px;
  color: #eaeaea;
  font-size: 13px;
}

.file-path-input:focus {
  outline: none;
  border-color: #4a9eff;
}

.file-path-input::-moz-placeholder {
  color: #555;
}

.file-path-input::placeholder {
  color: #555;
}

.browse-btn {
  padding: 10px 16px;
  background: #2a4a6a;
  border: none;
  border-radius: 6px;
  color: #eaeaea;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.browse-btn:hover {
  background: #3a5a7a;
}

.add-file-btn {
  padding: 10px 16px;
  background: #4caf50;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.add-file-btn:hover {
  background: #45a049;
}

.add-file-btn:disabled {
  background: #2a4a4a;
  color: #555;
  cursor: not-allowed;
}

.file-list {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.file-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: #16213e;
  border-radius: 6px;
  border: 1px solid #1a4a7a;
}

.file-icon {
  font-size: 18px;
}

.file-name {
  flex: 1;
  color: #eaeaea;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.file-type-badge {
  background: #1a4a7a;
  color: #4a9eff;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}

.remove-file-btn {
  width: 24px;
  height: 24px;
  background: #3d3d3d;
  border: none;
  border-radius: 4px;
  color: #888;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.remove-file-btn:hover {
  background: #f44336;
  color: #fff;
}

/* ========== PCB 参数设置样式 ========== */
.step-pcb-params {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.pcb-params-intro {
  text-align: center;
  padding-bottom: 16px;
  border-bottom: 1px solid #1a4a7a;
}

.pcb-params-intro h3 {
  color: #eaeaea;
  font-size: 18px;
  margin-bottom: 8px;
}

.pcb-params-intro p {
  color: #888;
  font-size: 14px;
}

.pcb-params-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.param-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.param-group label {
  color: #eaeaea;
  font-size: 14px;
  font-weight: 500;
}

.param-group input[type="number"],
.param-group select {
  padding: 10px 12px;
  background: #16213e;
  border: 1px solid #2a4a6a;
  border-radius: 6px;
  color: #eaeaea;
  font-size: 14px;
}

.param-group input[type="number"]:focus,
.param-group select:focus {
  outline: none;
  border-color: #4a9eff;
}

.checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checkbox-group input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #4a9eff;
}

.checkbox-group label {
  color: #ccc;
  font-size: 14px;
  font-weight: normal;
}

.pcb-preview-size {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background: #0a1628;
  border-radius: 8px;
  justify-content: center;
}

.size-label {
  color: #888;
  font-size: 14px;
}

.pcb-size-visual {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #333;
  border-radius: 4px;
  min-width: 100px;
  min-height: 80px;
}

.pcb-size-visual span {
  color: #fff;
  font-size: 12px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
}

/* ========== PCB 预览样式 ========== */
.step-pcb-preview {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.pcb-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.pcb-stats p {
  background: #1a4a7a;
  padding: 12px;
  border-radius: 6px;
  text-align: center;
  color: #eaeaea;
  font-size: 13px;
  margin: 0;
}

.pcb-canvas-wrapper {
  background: #0a1a2a;
  border: 2px solid #2a5a8a;
  border-radius: 8px;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.pcb-canvas {
  max-width: 100%;
  height: auto;
}
